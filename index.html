<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Habits · Panel de Rendimiento, Hábitos y Proyectos</title>

  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Nexora">
  <meta name="theme-color" content="#FDFBF7">

  <!-- Tipografías Modernas Originales -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Carga opcional de claves locales (ignorado en GitHub si está en .gitignore) -->
  <script src="config.local.js" onerror="window.NEXORA_ENV = window.NEXORA_ENV || {}"></script>

  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);

      --bg: #FDFBF7;
      --bg-warm: #F6EFE2;
      --surface: #FFFFFF;
      --surface-sand: #EFE6D5;
      --fg: #181512;
      --fg-muted: #6E655C;
      --border: #EAE0D0;
      --border-strong: #DFD2BE;

      --burgundy: #7C0A24;
      --burgundy-dark: #4A0514;
      --burgundy-soft: #FBE9ED;

      --gold: #D49B4B;
      --gold-dark: #B57D2E;
      --gold-soft: #FDF3E1;

      --green: #16803C;
      --green-soft: #E8F5EE;
      --red: #B91C1C;
      --red-soft: #FEE2E2;

      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-display: 'Space Grotesk', sans-serif;

      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-xl: 32px;

      --shadow-soft: 0 12px 32px -8px rgba(24, 21, 18, 0.06);
      --shadow-float: 0 20px 45px -12px rgba(24, 21, 18, 0.12);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 85% 10%, var(--bg-warm) 0%, var(--bg) 55%);
      color: var(--fg);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Estructura General con Menú Lateral */
    .app-shell {
      display: grid;
      grid-template-columns: 260px 1fr;
      max-width: 1420px;
      margin: 0 auto;
      gap: 24px;
      padding: 20px 20px 48px;
      align-items: start;
    }

    /* Menú Lateral (Sidebar) */
    .sidebar {
      position: sticky;
      top: 20px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 24px 18px;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 30;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 19px;
      letter-spacing: -0.5px;
      color: var(--fg);
      padding: 0 8px;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--burgundy);
      display: grid;
      place-items: center;
      color: #FFF;
      font-weight: 800;
      font-size: 15px;
      box-shadow: 0 4px 10px rgba(124, 10, 36, 0.3);
    }
    .side-nav {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .side-label {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--fg-muted);
      padding: 0 10px;
      margin-bottom: 4px;
    }
    .side-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      padding: 10px 12px;
      border-radius: 14px;
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 600;
      color: var(--fg-muted);
      cursor: pointer;
      text-align: left;
      transition: all 0.18s ease;
    }
    .side-btn:hover {
      background: var(--bg-warm);
      color: var(--fg);
    }
    .side-btn.active {
      background: var(--surface);
      border-color: var(--border-strong);
      color: var(--fg);
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(24, 21, 18, 0.05);
    }
    .side-btn .ico-box {
      width: 28px;
      height: 28px;
      border-radius: 8px;
    }
    .side-btn.active .ico-box {
      background: var(--burgundy);
      color: #FFFFFF;
    }
    .side-footer {
      border-top: 1px solid var(--border);
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Estado de Sincronización Blackboard */
    .bb-status {
      font-size: 11px;
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--bg-warm);
      border: 1px solid var(--border);
      color: var(--fg-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .bb-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
    }
    .bb-dot.ok { background: var(--green); }
    .bb-sync-btn {
      border: none;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
      color: var(--fg);
    }
    .bb-sync-btn:hover { border-color: var(--burgundy); color: var(--burgundy); }

    /* Iconos Minimalistas */
    .ico-box {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: var(--gold-soft);
      color: var(--gold-dark);
      border: 1px solid rgba(212, 155, 75, 0.25);
      display: inline-grid;
      place-items: center;
      flex-shrink: 0;
    }
    .ico-box svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .cta-pill {
      background: var(--burgundy);
      color: #FFFFFF;
      border: none;
      padding: 11px 18px;
      border-radius: 100px;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.15s ease, background 0.2s ease;
      box-shadow: 0 6px 16px -4px rgba(124, 10, 36, 0.4);
    }
    .cta-pill:hover {
      background: var(--burgundy-dark);
      transform: translateY(-1px);
    }

    .main-area { min-width: 0; }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.32fr 1fr;
      gap: 24px;
      align-items: start;
    }
    .dashboard-grid.single-col { grid-template-columns: 1fr; }

    @media (max-width: 1024px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { position: static; padding: 16px; }
      .side-nav { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
      .side-btn { width: auto; white-space: nowrap; }
      .side-label { display: none; }
    }
    @media (max-width: 860px) {
      .dashboard-grid { grid-template-columns: 1fr; }
    }

    /* Hero Izquierdo */
    .hero-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 30px;
      box-shadow: var(--shadow-soft);
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 20px;
      align-items: center;
      position: relative;
      overflow: visible;
      margin-bottom: 24px;
    }
    @media (max-width: 600px) {
      .hero-card { grid-template-columns: 1fr; padding: 22px; }
    }
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-warm);
      border: 1px solid var(--border-strong);
      color: var(--fg);
      padding: 5px 12px;
      border-radius: 100px;
      font-size: 11.5px;
      font-weight: 600;
      margin-bottom: 14px;
    }
    .badge-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--burgundy);
    }
    .hero-title {
      font-size: 36px; line-height: 1.06; font-weight: 800; letter-spacing: -1.2px; margin: 0 0 12px; color: var(--fg);
    }
    .hero-title span { color: var(--burgundy); }
    .hero-sub { color: var(--fg-muted); font-size: 13.8px; margin: 0 0 20px; max-width: 380px; }
    .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    .btn-outline {
      background: var(--surface); border: 1px solid var(--border-strong); color: var(--fg);
      padding: 10px 16px; border-radius: 100px; font-family: var(--font-sans); font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.15s;
    }
    .btn-outline:hover { background: var(--bg-warm); }
    .hero-features { display: flex; gap: 16px; font-size: 12px; color: var(--fg-muted); font-weight: 600; }
    .hero-features span { display: inline-flex; align-items: center; gap: 6px; }

    /* Rueda 3D con Insignia de Productividad SIEMPRE EN PRIMER PLANO */
    .sculpture-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding-top: 10px;
    }
    .sculpture-svg {
      width: 100%;
      max-width: 215px;
      height: auto;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 18px 24px rgba(24, 21, 18, 0.14));
    }
    .sculpture-pct {
      position: absolute;
      z-index: 5;
      font-family: var(--font-display);
      font-size: 29px;
      font-weight: 700;
      color: var(--fg);
      letter-spacing: -1px;
    }
    .prod-floating-badge {
      position: absolute;
      top: -6px;
      left: -8px;
      z-index: 25;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border: 1.5px solid var(--gold);
      border-radius: 16px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 9px;
      box-shadow: 0 14px 28px -4px rgba(24, 21, 18, 0.22);
      transform: translateZ(0);
    }
    .prod-floating-badge .ico-box {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--burgundy);
      color: #FFFFFF;
      border: none;
    }
    .prod-floating-badge div b {
      display: block;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.15;
      color: var(--fg);
    }
    .prod-floating-badge div small {
      display: block;
      font-size: 10px;
      color: var(--burgundy);
      font-weight: 700;
    }

    /* Barra Días */
    .days-bar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 18px; }
    .day-pill {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 10px 6px; text-align: center; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .day-pill:hover { border-color: var(--border-strong); transform: translateY(-1px); }
    .day-pill b { display: block; font-size: 14px; font-weight: 800; color: var(--fg); }
    .day-pill small { display: block; font-family: var(--font-display); font-size: 11px; color: var(--fg-muted); margin-top: 2px; }
    .day-pill.on { background: var(--burgundy); border-color: var(--burgundy); color: #FFFFFF; box-shadow: 0 8px 18px -4px rgba(124, 10, 36, 0.38); }
    .day-pill.on b, .day-pill.on small { color: #FFFFFF; }

    /* Tarjetas */
    .section-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl);
      padding: 24px; box-shadow: var(--shadow-soft); margin-bottom: 24px;
    }
    .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
    .section-head h2 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.4px; display: flex; align-items: center; gap: 10px; }

    /* Horario */
    .task-list { display: flex; flex-direction: column; gap: 10px; }
    .task-item {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
      padding: 14px 16px; border-radius: 18px; background: var(--bg); border: 1px solid var(--border); cursor: pointer; transition: all 0.18s ease;
    }
    .task-item:hover { border-color: var(--border-strong); background: #FFFFFF; box-shadow: 0 6px 16px rgba(0,0,0,0.04); }
    .task-item.now { border-color: var(--burgundy); background: #FFFFFF; box-shadow: 0 8px 24px -6px rgba(124, 10, 36, 0.18); }
    .task-item.done { opacity: 0.58; background: var(--bg-warm); }
    .task-item.done .task-title { text-decoration: line-through; color: var(--fg-muted); }
    .task-left { display: flex; gap: 12px; align-items: flex-start; }
    .task-time { font-family: var(--font-display); font-size: 12px; font-weight: 700; color: var(--fg-muted); display: flex; align-items: center; gap: 6px; }
    .now-badge { background: var(--burgundy); color: #FFF; font-size: 9px; font-weight: 800; padding: 2px 7px; border-radius: 100px; letter-spacing: 0.8px; }
    .task-title { font-weight: 700; font-size: 14.5px; color: var(--fg); margin: 2px 0 4px; }
    .task-loc { font-size: 11.5px; color: var(--fg-muted); font-weight: 500; }
    .supp-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .supp-chip {
      font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 100px; background: var(--surface);
      border: 1px solid var(--border-strong); color: var(--fg); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: all 0.15s;
    }
    .supp-chip.done { background: var(--burgundy); border-color: var(--burgundy); color: #FFFFFF; }
    .check-circle {
      width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border-strong);
      display: grid; place-items: center; color: #FFF; font-size: 13px; font-weight: 800; flex-shrink: 0; margin-top: 4px; transition: all 0.15s;
    }
    .task-item.done .check-circle { background: var(--burgundy); border-color: var(--burgundy); }

    /* Hidratación */
    .water-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .water-btn {
      padding: 12px; border-radius: 14px; border: 1px solid var(--border-strong); background: var(--bg);
      font-family: var(--font-sans); font-weight: 700; font-size: 13.5px; color: var(--fg); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.15s;
    }
    .water-btn.done { background: var(--burgundy); border-color: var(--burgundy); color: #FFFFFF; box-shadow: 0 6px 14px -4px rgba(124, 10, 36, 0.35); }

    /* Columna Derecha */
    .impact-panel { background: var(--bg-warm); border: 1px solid var(--border-strong); border-radius: var(--radius-xl); padding: 26px; box-shadow: var(--shadow-soft); position: relative; }
    .impact-title { font-size: 24px; font-weight: 800; letter-spacing: -0.7px; line-height: 1.15; margin: 0 0 6px; }
    .impact-sub { font-size: 13px; color: var(--fg-muted); margin: 0 0 20px; }

    .kpi-band {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 18px 12px;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; box-shadow: 0 8px 24px -6px rgba(24, 21, 18, 0.05); margin-bottom: 22px;
    }
    .kpi-box { display: flex; flex-direction: column; align-items: center; }
    .kpi-box .ico-box { margin-bottom: 6px; }
    .kpi-num { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--fg); letter-spacing: -0.5px; }
    .kpi-label { font-size: 11px; color: var(--fg-muted); line-height: 1.25; margin-top: 2px; font-weight: 500; }

    .floating-chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 20px; box-shadow: var(--shadow-float); margin-bottom: 24px; position: relative; }
    .fc-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .fc-head b { font-size: 15px; font-weight: 800; letter-spacing: -0.3px; }
    .fc-pill { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--fg-muted); }
    .fc-svg-container { position: relative; width: 100%; height: 155px; }
    .fc-highlight-box {
      position: absolute; right: 12px; bottom: 12px; background: linear-gradient(135deg, var(--burgundy) 0%, var(--burgundy-dark) 100%);
      color: #FFFFFF; padding: 9px 13px;
